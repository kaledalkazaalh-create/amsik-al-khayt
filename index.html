<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#48020c">
  <link rel="icon" href="data:,">
  <title></title>
  <script>const GAME_URL = ""; // Optional: the public HTTPS URL to play.html.</script>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="assets/qrcode.js"></script>
  <script defer src="booth.js"></script>
</head>
<body class="booth">
  <header class="topbar booth-top"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span data-institution></span></div></header>
  <main class="booth-layout">
    <section class="booth-intro">
      <h1 data-title></h1>
      <p class="booth-hook" data-copy="boothHook"></p>
      <p class="duration" data-copy="duration"></p>
    </section>
    <section class="booth-scan">
      <div class="qr-wrap">
        <span class="orb" aria-hidden="true"></span>
        <canvas id="qr" role="img" hidden></canvas>
        <p id="qr-status" class="qr-status" role="status" hidden></p>
      </div>
      <p class="scan-label" data-copy="boothInstructions"></p>
      <a class="booth-link" id="game-link" href="play.html" dir="auto" data-copy="boothOpen"></a>
      <button class="print-button" type="button" id="print-button" data-copy="boothPrint"></button>
    </section>
  </main>
  <noscript lang="ar">شغّل جافاسكريبت في متصفّحك لعرض الرمز.</noscript>
</body>
</html>
