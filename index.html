<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#48020c">
  <title>أمسك الخيط · البوث</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <script defer src="data.js?v=3.1"></script>
  <script defer src="assets/qrcode.js"></script>
  <script defer src="booth.js"></script>
  <script defer src="mascots.js?v=3"></script>
  <script defer src="campus-show.js?v=3"></script>
</head>
<body class="booth">
  <main class="booth-layout">
    <div class="booth-intro">
      <p class="masthead" data-text="institution"></p>
      <h1 data-text="title"></h1>
      <p class="booth-hook" data-text="hook"></p>
      <figure class="campus-show">
        <canvas id="campus-canvas" width="760" height="420" role="img" aria-label="سنافر زرقاء تلاعب الكرة وتتنافس عليها. يصل صديقها بسيارة، ثم تطير طائرة ورقية وتلتقط صورة جماعية وتشير إلى رمز اللعبة."></canvas>
        <button class="show-toggle" type="button" aria-controls="campus-canvas" hidden>أوقف الحركة</button>
      </figure>
      <nav class="booth-nav" aria-label="خيارات البوث">
        <a href="?display=1" data-text="display"></a>
        <a href="print.html" data-text="poster"></a>
        <a class="direct-link" href="play.html" data-text="try"></a>
      </nav>
    </div>
    <section class="scan-area" aria-label="رمز اللعبة">
      <h2 data-text="scan"></h2>
      <canvas id="qr" role="img" hidden></canvas>
      <p id="qr-status" role="status" hidden></p>
      <a class="game-url" href="play.html" dir="ltr" hidden></a>
    </section>
  </main>
  <noscript>فعّل جافاسكريبت في متصفّحك لعرض هذه الصفحة.</noscript>
</body>
</html>
