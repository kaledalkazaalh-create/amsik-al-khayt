<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#48020c">
  <title>أمسك الخيط · البوث</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=10">
  <script defer src="data.js?v=7"></script>
  <script defer src="assets/qrcode.js"></script>
  <script defer src="booth.js?v=2"></script>
  <script defer src="mascots.js?v=7"></script>
  <script defer src="campus-show.js?v=9"></script>
</head>
<body class="booth">
  <main class="booth-layout">
    <div class="booth-intro">
      <p class="masthead" data-text="institution"></p>
      <h1 data-text="title"></h1>
      <p class="booth-hook" data-text="hook"></p>
      <nav class="booth-nav" aria-label="خيارات البوث">
        <a href="?display=1" data-text="display"></a>
        <a href="print.html" data-text="poster"></a>
        <a class="direct-link" href="play.html" data-text="try"></a>
      </nav>
    </div>
    <section class="scan-area" aria-label="رمز اللعبة">
      <h2 data-text="scan"></h2>
      <div class="campus-show">
        <canvas id="qr" role="img" hidden></canvas>
        <canvas id="campus-canvas" width="720" height="650" aria-hidden="true"></canvas>
      </div>
      <p id="qr-status" role="status" hidden></p>
      <div class="scan-actions">
        <button class="show-toggle" type="button" aria-controls="campus-canvas" hidden>ثبّت الرمز للمسح</button>
        <a class="game-url" href="play.html" hidden></a>
      </div>
    </section>
  </main>
  <noscript>فعّل جافاسكريبت في متصفّحك لعرض هذه الصفحة.</noscript>
</body>
</html>
